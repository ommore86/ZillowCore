
services:
  # 1. FastAPI backend
  - type: web
    name: estateos-api
    runtime: python
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true

    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    preDeployCommand: python backend/scripts/migrate_and_seed.py
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    disk:
      name: estateos-storage
      mountPath: /var/data
      sizeGB: 10

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PYTHONPATH
        value: backend
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: estateos-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: estateos-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_DEMO_MODE
        value: "true"
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. AI background worker
  - type: worker
    name: estateos-ai-worker
    runtime: python
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true

    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python -m app.worker

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PYTHONPATH
        value: backend
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: estateos-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: estateos-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: estateos-api
          envVarKey: SECRET_KEY
      - key: AI_DEMO_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 3. Redis-compatible task queue
  - type: keyvalue
    name: estateos-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # 4. Managed PostgreSQL
  - name: estateos-postgres
    databaseName: estateos
    user: estateos_admin
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
