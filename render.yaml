
# EstateOS AI - FREE Render Blueprint
# Frontend: Vercel
# Backend: Render Free
# Database: Render Free PostgreSQL
# Redis: Render Free Key Value
#
# NOTE:
# - Separate background worker removed (not available on Free).
# - Persistent disks removed (not available on Free).
# - Render PostgreSQL Free expires after 30 days.

services:

  # 1. FastAPI Backend
  - type: web
    name: estateos-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeploy: true

    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt

    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"

      - key: PYTHONPATH
        value: backend

      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: estateos-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: estateos-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: AI_DEMO_MODE
        value: "true"

      - key: CORS_ORIGIN_REGEX
        sync: false

      - key: STORAGE_BACKEND
        value: local

      - key: UPLOAD_DIR
        value: /tmp/estateos-uploads

      - key: OPENAI_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

  # 2. Free Redis-compatible Key Value
  - type: keyvalue
    name: estateos-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:

  # 3. Free PostgreSQL
  - name: estateos-postgres
    databaseName: estateos
    user: estateos_admin
    region: oregon
    plan: free
    postgresMajorVersion: "16"
